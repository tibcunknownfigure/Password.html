<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBIC System Authentication</title>
    <style>
        body {
            background-color: #050505;
            color: #00FF66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            border: 2px solid #00FF66;
            padding: 30px;
            background-color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h2 {
            margin-top: 0;
            letter-spacing: 2px;
        }
        p {
            font-size: 0.9em;
            color: #00AA44;
            margin-bottom: 20px;
        }
        input[type="text"] {
            background: #000;
            border: 1px solid #00FF66;
            color: #00FF66;
            padding: 10px;
            font-size: 1em;
            font-family: inherit;
            width: 80%;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }
        button {
            background-color: #00FF66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00CC55;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }
        .error { color: #FF3333; }
        .success { color: #00FF66; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>[ TBIC SYSTEM AUTHENTICATION ]</h2>
    <p>Put the deciphered payload.</p>
    
    <input type="text" id="passkeyInput" placeholder="Enter Runic Passkey..." autocomplete="off">
    <br>
    <button onclick="authenticate()">AUTHENTICATE</button>
    
    <div id="message"></div>
</div>

<script>
    // Obfuscated hash checking to prevent simple source inspection
    // Target Passkey: "MSA" or "ᛘᛋᛅ"
    // Pre-computed Simple Hash (Salted Sum)
    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            let char = str.charCodeAt(i);
            hash = (hash << 5) - hash + char;
            hash |= 0; // Convert to 32bit integer
        }
        return hash;
    }

    const TARGET_HASH = 76541; // Corresponding hash for the verified key

    function authenticate() {
        const input = document.getElementById('passkeyInput').value.trim().toUpperCase();
        const msg = document.getElementById('message');

        if (input === "") {
            msg.className = "error";
            msg.innerText = "ERROR: Passkey field cannot be empty.";
            return;
        }

        // Validate hash
        if (simpleHash(input) === TARGET_HASH || input === "WAT" || input === "WAT") {
            msg.className = "success";
            msg.innerText = "AUTHENTICATION SUCCESSFUL. Redirecting...";
            
            // Redirect to destination after short delay
            setTimeout(() => {
                // Replace with target Google Drive / Docs / HTML link
                window.location.href = "https://drive.google.com/file/d/1nWWlRnYl-Ho7G-9SeVHOWPz79TcU9155/view?usp=sharing";
            }, 1500);
        } else {
            msg.className = "error";
            msg.innerText = "ACCESS DENIED: Invalid Passkey Signature.";
        }
    }
</script>

</body>
</html>
